
name: PowerTools Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven-Struktur vorbereiten
        run: |
          mkdir -p src/main/java/de/powersmp/powertools
          mkdir -p src/main/resources
          mkdir -p lib

          if [ -f PowerTools.java ]; then
            cp PowerTools.java src/main/java/de/powersmp/powertools/PowerTools.java
          fi

          if [ -f config.yml ]; then
            cp config.yml src/main/resources/config.yml
          fi

          if [ -f plugin.yml ]; then
            cp plugin.yml src/main/resources/plugin.yml
          fi

          if [ -f PowerEco.jar ]; then
            cp PowerEco.jar lib/PowerEco.jar
          fi

          test -f pom.xml
          test -f src/main/java/de/powersmp/powertools/PowerTools.java
          test -f src/main/resources/plugin.yml
          test -f lib/PowerEco.jar

      - name: Plugin kompilieren
        run: mvn -B clean package

      - name: JAR überprüfen
        run: |
          test -f target/PowerTools-1.3.4.jar
          jar tf target/PowerTools-1.3.4.jar | grep -q "plugin.yml"
          jar tf target/PowerTools-1.3.4.jar | grep -q "config.yml"
          echo "PowerTools JAR erfolgreich erstellt!"

      - name: Release ZIP vorbereiten
        run: |
          mkdir -p release/PowerTools-1.3.4

          cp target/PowerTools-1.3.4.jar release/PowerTools-1.3.4/

          if [ -f PowerEco.jar ]; then
            cp PowerEco.jar release/PowerTools-1.3.4/
          fi

          cat > release/PowerTools-1.3.4/README.txt << 'EOF'
          PowerTools 1.3.4

          Installation:
          1. PowerTools-1.3.4.jar in den plugins-Ordner kopieren.
          2. Falls PowerEco benötigt wird, auch PowerEco.jar installieren.
          3. Server neu starten.
          EOF

          cd release
          zip -r PowerTools-1.3.4.zip PowerTools-1.3.4

      - name: Build-Dateien veröffentlichen
        uses: actions/upload-artifact@v4
        with:
          name: PowerTools-1.3.4-Release
          path: |
            target/PowerTools-1.3.4.jar
            release/PowerTools-1.3.4.zip
          if-no-files-found: error
